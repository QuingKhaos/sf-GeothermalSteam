;METADATA=(Diff=true, UseCommands=true)
[CommonSettings]
ManifestDependencies=Content/Localization/Game/Game.manifest
ManifestDependencies=Mods/SML/Content/Localization/SML/SML.manifest
ManifestDependencies=Mods/GameFeatures/SuperHeatedSteam/Content/Localization/SuperHeatedSteam/SuperHeatedSteam.manifest
ModulesToPreload=GeothermalSteam
SourcePath=Mods/GameFeatures/GeothermalSteam/Content/Localization/GeothermalSteam
DestinationPath=Mods/GameFeatures/GeothermalSteam/Content/Localization/GeothermalSteam
ManifestName=GeothermalSteam.manifest
ArchiveName=GeothermalSteam.archive
NativeCulture=en
CulturesToGenerate=en

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Mods/GameFeatures/GeothermalSteam/Source
SearchDirectoryPaths=%LOCPROJECTROOT%Mods/GameFeatures/GeothermalSteam/Config
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=%LOCPROJECTROOT%Mods/GameFeatures/GeothermalSteam/Content/*
ExcludePathFilters=Content/Localization/*
ExcludePathFilters=Content/L10N/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldExcludeDerivedClasses=false
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=GeothermalSteam.csv
bConflictReport=true
ConflictReportName=GeothermalSteam_Conflicts.txt

